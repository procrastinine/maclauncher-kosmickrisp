[binaries]
c = ['/usr/bin/clang']
cpp = ['/usr/bin/clang++']
objc = ['ccache', 'clang']
ar = '/usr/bin/ar'
strip = '/usr/bin/strip'
pkg-config = 'pkg-config'
[built-in options]
buildtype = 'release'
wrap_mode = 'nofallback'
c_args = ['-mmacosx-version-min=26.0']
c_link_args = ['-mmacosx-version-min=26.0']
cpp_args = ['-mmacosx-version-min=26.0']
cpp_link_args = ['-mmacosx-version-min=26.0']
objc_args = ['-mmacosx-version-min=26.0']
objc_link_args = ['-mmacosx-version-min=26.0']

[project options]
vulkan-drivers = 'kosmickrisp'
gallium-drivers = []
platforms = ['macos']
opengl = false
gles1 = 'disabled'
gles2 = 'disabled'
egl = 'disabled'
glx = 'disabled'
gbm = 'disabled'
spirv-tools = 'enabled'
zstd = 'enabled'
xmlconfig = 'enabled'
build-tests = false
video-codecs = []
llvm = 'enabled'
shared-llvm = 'enabled'
mesa-clc = 'enabled'
precomp-compiler = 'enabled'
