[binaries]
c = ['/usr/bin/clang', '-arch', 'x86_64']
cpp = ['/usr/bin/clang++', '-arch', 'x86_64']
objc = ['/usr/bin/clang', '-arch', 'x86_64']
objcpp = ['/usr/bin/clang++', '-arch', 'x86_64']
ar = '/usr/bin/ar'
strip = '/usr/bin/strip'
pkg-config = 'pkg-config'
[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
[properties]
needs_exe_wrapper = false
[built-in options]
buildtype = 'release'
wrap_mode = 'nofallback'
c_args = ['-mmacosx-version-min=26.0']
c_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=26.0']
cpp_args = ['-mmacosx-version-min=26.0']
cpp_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=26.0']
objc_args = ['-mmacosx-version-min=26.0']
objc_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=26.0']
objcpp_args = ['-mmacosx-version-min=26.0']
objcpp_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=26.0']

[project options]
vulkan-drivers = 'kosmickrisp'
gallium-drivers = []
platforms = ['macos']
opengl = false
gles1 = 'disabled'
gles2 = 'disabled'
egl = 'disabled'
glx = 'disabled'
gbm = 'disabled'
spirv-tools = 'enabled'
zstd = 'enabled'
xmlconfig = 'enabled'
build-tests = false
video-codecs = []
llvm = 'disabled'
mesa-clc = 'system'
precomp-compiler = 'system'
